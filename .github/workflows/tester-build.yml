name: Build Tester (Android APK & iOS IPA)

on:
  push:
    branches:
      - 'release/tester'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://testmamnonhontre.sorak.io.vn/api' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & Prepare Tester APK
        run: |
          OUTPUT_DIR="android/app/build/outputs/apk/release"
          APK_NAME="sorak-android-${{ github.sha }}.apk"

          if [ -f "$OUTPUT_DIR/app-release.apk" ]; then
            echo "Release APK already signed by Gradle."
            cp "$OUTPUT_DIR/app-release.apk" "$APK_NAME"
          elif [ -f "$OUTPUT_DIR/app-release-unsigned.apk" ]; then
            echo "Release APK is unsigned. Signing with tester keystore..."
            keytool -genkey -v -keystore tester.keystore \
              -alias androidtester -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Sorak Tester, OU=QA, O=Sorak, L=HCM, ST=HCM, C=VN"

            BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
            echo "Using apksigner from: $BUILD_TOOLS_DIR"
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks tester.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$APK_NAME" \
              "$OUTPUT_DIR/app-release-unsigned.apk"
          else
            echo "Searching for any generated APK..."
            ANY_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$ANY_APK" ]; then
              cp "$ANY_APK" "$APK_NAME"
            else
              echo "Error: No APK found!"
              exit 1
            fi
          fi

          echo "APK successfully prepared: $APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorak-android-${{ github.sha }}
          path: sorak-android-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS IPA (Unsigned for Sideloadly)
    runs-on: macos-14
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://testmamnonhontre.sorak.io.vn/api' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode (Release Unsigned)
        run: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); console.log(data.workspace.schemes[0]);")
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME (Unsigned Release)"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA (Payload/*.app)
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Searching across entire build directory for .app bundle..."
            APP_PATH=$(find build -name "*.app" | grep -v "DerivedData.*Intermediate" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle!"
            exit 1
          fi

          echo "Found .app bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          IPA_NAME="sorak-ios-${{ github.sha }}.ipa"
          zip -r "../$IPA_NAME" Payload
          cd ..

          echo "IPA successfully packaged: $IPA_NAME"
          ls -lh "$IPA_NAME"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorak-ios-${{ github.sha }}
          path: sorak-ios-${{ github.sha }}.ipa
          if-no-files-found: error
          retention-days: 14
